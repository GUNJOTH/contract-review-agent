[project]
name = "contract-review-app"
version = "0.1.0"
description = "合同审查智能体 - 扫描页通过 OCR 网关识别"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "celery>=5.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.0",
    "redis[hiredis]>=5.2.1",
    "pymupdf>=1.25.0",
    "prometheus_client>=0.21.0",
    "pynvml>=11.5.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "httpx2>=2.12.0",
    # Starlette 1.6 still references anyio.abc.BlockingPortal.
    "anyio>=4.14,<4.16",
]
otel = [
    "opentelemetry-api>=1.31.0",
]

[project.scripts]
contract-review = "contract_review_app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".test-work/pytest-cache"

[tool.coverage.run]
branch = true
source = ["contract_review", "contract_review_app"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
extend-exclude = [".test-work", ".uv-cache", "runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
