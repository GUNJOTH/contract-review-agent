[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-review-agent"
version = "0.1.0"
description = "Evidence-first contract document parsing and review foundation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
contract-review = "contract_review.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
