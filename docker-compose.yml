services:
  contract-review:
    build: .
    container_name: contract-review
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - VIRTUAL_ENV=/app/.venv
      - PATH=/app/.venv/bin:$PATH
      - HOST=0.0.0.0
      - CELERY_WORKER_CONCURRENCY=2
      - CELERY_WORKER_PREFETCH_MULTIPLIER=1
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./runtime:/app/runtime
